services:
  - type: web
    name: analytics-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.3"
      - key: DATABASE_URL
        value: "sqlite:////data/dashboard.db"
    
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: analytics-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: VITE_API_URL
        fromService:
          type: web
          name: analytics-backend
          envVarKey: RENDER_EXTERNAL_URL
