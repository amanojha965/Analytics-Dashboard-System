services:
  - type: web
    name: analytics-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.3"
      - key: DATABASE_URL
        sync: false # Set this securely in your Render Dashboard to your Neon Postgres URL
      - key: SECRET_KEY
        generateValue: true # Render will automatically generate a secure hex key for you
      - key: FRONTEND_URL
        fromService:
          type: web
          name: analytics-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: analytics-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        fromService:
          type: web
          name: analytics-backend
          envVarKey: RENDER_EXTERNAL_URL
